app = 'vexchange-api'
primary_region = 'sjc'

[build]

[http_service]
internal_port = 80
force_https = true
auto_stop_machines = 'off' # use suspend or off, but never stop, as stopped machines take a long time to get back up again
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[http_service.checks]]
grace_period = "30s"
interval = "60s"
method = "GET"
timeout = "10s"
path = "/health"

[deploy]
strategy = 'rolling'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024
